name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck (api + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @spa/api exec prisma generate

      - name: Typecheck API
        run: pnpm --filter @spa/api exec tsc --noEmit

      - name: Typecheck Web
        run: pnpm --filter @spa/web exec tsc --noEmit

      - name: Unit tests (API)
        run: pnpm --filter @spa/api run test

  prisma-validate:
    name: Validate Prisma schema
    runs-on: ubuntu-latest
    env:
      # prisma validate resuelve env("DATABASE_URL") aunque no conecta a la DB.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate schema
        run: pnpm --filter @spa/api exec prisma validate

      - name: Format schema (check only)
        run: |
          pnpm --filter @spa/api exec prisma format
          if ! git diff --exit-code apps/api/prisma/schema.prisma; then
            echo "::error::schema.prisma no está formateado. Corre: pnpm --filter @spa/api exec prisma format" >&2
            exit 1
          fi

  mobile-typecheck:
    name: Typecheck mobile (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        # --include=dev fuerza @types/node y demás devDependencies (algún
        # default del runner las estaba omitiendo).
        run: cd apps/mobile && npm install --no-audit --no-fund --include=dev
      # Expo autogenera expo-env.d.ts (gitignored) al arrancar; en CI lo creamos
      # manualmente para que tsc tenga los tipos de expo (process.env, etc.).
      - name: Generate Expo env types
        run: cd apps/mobile && printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
      - name: Typecheck
        run: cd apps/mobile && npx tsc --noEmit
