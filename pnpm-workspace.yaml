packages:
  - "apps/api"
  - "apps/web"
  - "packages/*"
  # apps/mobile NO está en el workspace: se maneja standalone con npm
  # (por compatibilidad con EAS Build que viene con pnpm 8.x antiguo).
  # Para dev local: cd apps/mobile && npm install && npm run dev

# Permitir scripts post-install necesarios (Prisma genera cliente, esbuild compila binarios)
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true

# Forzar una sola versión de @types/react (la web y la móvil traen versiones distintas)
overrides:
  '@types/react': '18.3.12'
  '@types/react-dom': '18.3.1'
